<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>مستعرض فيديوهات يوتيوب الذكي</title>
        <style>
            :root {
                  --bg: #0f1117;
                        --card: #181b24;
                              --border: #2a2f3e;
                                    --accent: #ff2e4c;
                                          --accent-hover: #e0203c;
                                                --text: #f3f4f6;
                                                      --muted: #9ca3af;
                                                          }

                                                              * {
                                                                    box-sizing: border-box;
                                                                          margin: 0;
                                                                                padding: 0;
                                                                                      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
                                                                                          }

                                                                                              body {
                                                                                                    background: radial-gradient(circle at top, #1f1625 0%, var(--bg) 55%);
                                                                                                          color: var(--text);
                                                                                                                min-height: 100vh;
                                                                                                                      display: flex;
                                                                                                                            justify-content: center;
                                                                                                                                  align-items: center;
                                                                                                                                        padding: 24px;
                                                                                                                                            }

                                                                                                                                                .container {
                                                                                                                                                      width: 100%;
                                                                                                                                                            max-width: 720px;
                                                                                                                                                                  background: var(--card);
                                                                                                                                                                        border: 1px solid var(--border);
                                                                                                                                                                              border-radius: 20px;
                                                                                                                                                                                    padding: 32px;
                                                                                                                                                                                          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
                                                                                                                                                                                              }

                                                                                                                                                                                                  header {
                                                                                                                                                                                                        text-align: center;
                                                                                                                                                                                                              margin-bottom: 28px;
                                                                                                                                                                                                                  }

                                                                                                                                                                                                                      header h1 {
                                                                                                                                                                                                                            font-size: 1.8rem;
                                                                                                                                                                                                                                  margin-bottom: 8px;
                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                          header p {
                                                                                                                                                                                                                                                color: var(--muted);
                                                                                                                                                                                                                                                      font-size: 0.95rem;
                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                              .input-group {
                                                                                                                                                                                                                                                                    display: flex;
                                                                                                                                                                                                                                                                          gap: 10px;
                                                                                                                                                                                                                                                                                margin-bottom: 16px;
                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                        input[type="text"] {
                                                                                                                                                                                                                                                                                              flex: 1;
                                                                                                                                                                                                                                                                                                    padding: 14px 16px;
                                                                                                                                                                                                                                                                                                          border-radius: 12px;
                                                                                                                                                                                                                                                                                                                border: 1px solid var(--border);
                                                                                                                                                                                                                                                                                                                      background: #10131a;
                                                                                                                                                                                                                                                                                                                            color: var(--text);
                                                                                                                                                                                                                                                                                                                                  font-size: 1rem;
                                                                                                                                                                                                                                                                                                                                        outline: none;
                                                                                                                                                                                                                                                                                                                                              transition: border-color 0.2s;
                                                                                                                                                                                                                                                                                                                                                    direction: ltr;
                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                            input[type="text"]:focus {
                                                                                                                                                                                                                                                                                                                                                                  border-color: var(--accent);
                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                          button {
                                                                                                                                                                                                                                                                                                                                                                                padding: 14px 22px;
                                                                                                                                                                                                                                                                                                                                                                                      border: none;
                                                                                                                                                                                                                                                                                                                                                                                            border-radius: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                  background: var(--accent);
                                                                                                                                                                                                                                                                                                                                                                                                        color: #fff;
                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 1rem;
                                                                                                                                                                                                                                                                                                                                                                                                                    font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                                                                                          cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                transition: background 0.2s, transform 0.1s;
                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                        button:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                              background: var(--accent-hover);
                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                      button:active {
                                                                                                                                                                                                                                                                                                                                                                                                                                                            transform: scale(0.98);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .error {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          color: #ff6b81;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                font-size: 0.9rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      margin-bottom: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            display: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .result {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          display: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                margin-top: 24px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      animation: fadeIn 0.35s ease;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              @keyframes fadeIn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    from { opacity: 0; transform: translateY(8px); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          to { opacity: 1; transform: translateY(0); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .video-wrapper {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        position: relative;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              padding-bottom: 56.25%; /* نسبة 16:9 */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    height: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          overflow: hidden;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                border-radius: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      border: 1px solid var(--border);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-bottom: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .video-wrapper iframe {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          position: absolute;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                top: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      left: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  height: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .info-box {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      background: #10131a;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border: 1px solid var(--border);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              margin-bottom: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .info-box label {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 0.85rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: var(--muted);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              margin-bottom: 6px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .copy-row {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  gap: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .copy-row code {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      flex: 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-family: monospace;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 0.85rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #d1d5db;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              overflow-x: auto;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    white-space: nowrap;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          direction: ltr;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                text-align: left;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .copy-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              padding: 8px 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 0.85rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          background: #2a2f3e;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .copy-btn:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        background: #3b4257;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                @media (max-width: 550px) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .input-group {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              flex-direction: column;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h1>مستعرض فيديوهات يوتيوب</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>الصق رابط أي مقطع يوتيوب لتشغيله فوراً والحصول على كود التضمين الخاص به</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="input-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="loadVideo()">عرض الفيديو</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
